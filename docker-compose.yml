services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rate-limiter:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-token_bucket}
      RATE_LIMIT_FAIL_MODE: ${RATE_LIMIT_FAIL_MODE:-closed}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      WS_DECISION_SAMPLE_RATE: ${WS_DECISION_SAMPLE_RATE:-0.04}
      METRICS_FLUSH_MS: ${METRICS_FLUSH_MS:-100}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3008:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
        VITE_API_BASE: /api
    depends_on:
      - rate-limiter
    ports:
      - "8088:80"

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
